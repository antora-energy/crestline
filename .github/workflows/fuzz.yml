# Differential fuzzing for wrong answers (docs/benchmarks.md, "Fuzzing";
# bench/fuzz.py): crest against the latest HiGHS release and SCIP on random
# small MIPs, HiGHS's check/instances, easy MIPLIB 2017 collection models and
# perturbed private dispatch models (asross/crestline-dispatch, read by a
# deploy key; perturbed in the runner's temp directory, never uploaded). Run
# by hand (workflow_dispatch) or by pushing a branch fuzz-run/*. Logs and
# results are public: names, seeds, options, statuses, objectives, bounds and
# times only. Results: the fuzz-results artifact and the run summary.
name: fuzz
on:
  push:
    branches: ['fuzz-run/**']
  workflow_dispatch:
    inputs:
      sources:
        description: "bench/fuzz.py sources (random:2000,check,miplib,dispatch:6)"
      shards:
        description: "Runners per architecture (40)"
      archs:
        description: "x64, arm64 or both, comma-separated (x64)"
      crest_ref:
        description: "crest git ref (this commit)"

env:
  SOURCES: "${{ inputs.sources || 'random:2000,check,miplib,dispatch:6' }}"
  SHARDS: "${{ inputs.shards || '40' }}"
  ARCHS: "${{ inputs.archs || 'x64' }}"
  CREST_REF: "${{ inputs.crest_ref || github.sha }}"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      archs: ${{ steps.p.outputs.archs }}
      runs: ${{ steps.p.outputs.runs }}
      highs: ${{ steps.p.outputs.highs }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          runner = {'x64': 'ubuntu-24.04', 'arm64': 'ubuntu-24.04-arm'}
          archs = [a.strip() for a in os.environ['ARCHS'].split(',') if a.strip()]
          print('archs=' + json.dumps([dict(arch=a, runner=runner[a]) for a in archs]))
          print('runs=' + json.dumps([dict(arch=a, runner=runner[a], shard=k) for a in archs for k in range(int(os.environ['SHARDS']))]))
          EOF
          echo "highs=$(gh release view -R ERGO-Code/HiGHS --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.archs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CREST_REF }}
      - uses: dtolnay/rust-toolchain@stable
      # x64: x86-64-v3 as on AWS Lambda (README); arm64: the default target
      - run: |
          if [ "${{ matrix.arch }}" = x64 ]; then
            export RUSTFLAGS="-C llvm-args=-unroll-runtime=false -C target-cpu=x86-64-v3"
          fi
          cargo build --release --bin crest
          mkdir -p out && cp target/release/crest out/
      - uses: actions/upload-artifact@v4
        with:
          name: crest-${{ matrix.arch }}
          path: out

  run:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: crest-${{ matrix.arch }}
          path: bins
      - name: Solvers and HiGHS's check/instances
        env:
          TAG: ${{ needs.plan.outputs.highs }}
        run: |
          chmod +x bins/crest
          a=$([ "${{ matrix.arch }}" = x64 ] && echo x86_64 || echo aarch64)
          mkdir highs && curl -sfL --retry 3 "https://github.com/ERGO-Code/HiGHS/releases/download/$TAG/highs-${TAG#v}-$a-linux-gnu-static-mit.tar.gz" | tar xz -C highs
          pip install -q numpy highspy pyscipopt
          git clone -q --depth 1 --branch "$TAG" --filter=blob:none --sparse https://github.com/ERGO-Code/HiGHS hsrc
          git -C hsrc sparse-checkout set check/instances
      - if: contains(env.SOURCES, 'dispatch')
        uses: actions/checkout@v5
        with:
          repository: asross/crestline-dispatch
          ssh-key: ${{ secrets.DISPATCH_DEPLOY_KEY }}
          path: dispatch
      - if: contains(env.SOURCES, 'miplib')
        uses: actions/cache@v4
        with:
          path: inst
          key: fuzz-inst-${{ matrix.shard }}of${{ env.SHARDS }}
      - env:
          SHARD: ${{ matrix.shard }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 bench/fuzz.py run results-$ARCH-$SHARD.jsonl --crest bins/crest --highs highs/bin/highs \
            --sources "$SOURCES" --shard "$SHARD/$SHARDS" --check-dir hsrc/check/instances \
            --dispatch-dir dispatch/instances --tmp "$RUNNER_TEMP/fuzz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.arch }}-${{ matrix.shard }}
          path: results-*.jsonl

  report:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: res
          merge-multiple: true
      - run: |
          pip install -q numpy highspy
          cat res/*.jsonl > fuzz-results.jsonl
          python3 bench/fuzz.py report fuzz-results.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: fuzz-results.jsonl
